:root {

  /* Transitions */
  --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
}

/* ─── RESET & BASE ─── */
*, *::before, *::after {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {

  -moz-osx-font-smoothing: grayscale;

}

body {

/* ─── TIPOGRAFÍA NUMÉRICA TABULAR ─── */

.card {

@keyframes fadeInUp {

  to   { opacity: 1; transform: translateY(0); }
}

.animate-fade-in-up {

}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50%       { opacity: 0.4; transform: scale(0.82); }
}

.live-pulse {
  animation: pulseDot 1.8s ease-in-out infinite;

  to   { transform: translateX(0) scale(1);       opacity: 1; }

.toast-animate {
  animation: toastSlideIn 0.28s var(--ease-smooth) both;

@keyframes shimmer {
  0%   { background-position: -200% 0; }
  100% { background-position:  200% 0; }
}
.shimmer {
  background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);

/* ─── DISPLAY MONETARIO ─── */

/* ─── SECCIÓN SEPARADORA ─── */
.section-divider {

/* ─── ATAJOS DE TECLADO ─── */

  background: #f1f5f9;
  border: 1px solid var(--border-strong);
  color: var(--text-secondary);
  box-shadow: 0 1px 0 var(--border-strong);
}

/* ─── IMPRESIÓN ─── */
@media print {
  body {
    background: #ffffff !important;
    color: #000000 !important;
  }
  .no-print { display: none !important; }
}

        if (manualTxDesc.trim().length <= 10) {

                body: JSON.stringify({
                    imageBase64: 'data:image/jpeg;base64,PARKOPS_SERRANO447_LPR_FRAME',
                    mimeType: 'image/jpeg',
                }),
            });
            const json = await res.json();
            const lpr = json?.data;
            const cleanPlate = (lpr?.plate || 'KJ8921').replace(/[^A-Z0-9]/gi, '').toUpperCase();
            setEntryPlate(cleanPlate);
            if (lpr?.vehicleTypeHint === 'CAMIONETA') {
                setSelectedCategory('SUV');
                setSelectedRate(30);
            }
            else if (lpr?.vehicleTypeHint === 'MOTO') {
                setSelectedCategory('Moto');
                setSelectedRate(15);

            else {

                setSelectedRate(25);

            const samplePlates = ['KJ8921', 'RT4410', 'PL9012', 'GH3389'];

          </div>)}

        {/* AUXILIARY VIEWS: MAP/ANALYTICS, SUPPORT, REPORTS, CLIENTS, SETTINGS */}
        <OfficialAuxViews activeView={activeView} activeVehicles={activeVehicles} auditLogs={auditLogs} showToast={showToast} onSelectVehicleForCheckout={(v) => {
            loadVehicleIntoExit(v);
            setActiveView('pos');
            setPosSubtab('exit');
        }} onInitiateCashClose={initiateCashClose} isOfflineMode={isOfflineMode} onToggleOfflineMode={() => {
            setIsOfflineMode((prev) => {
                const next = !prev;
                showToast(next
                    ? 'Modo Contingencia Offline (-O) activado. Persistencia local IndexedDB.'
                    : 'Conexión con Cloud Run restablecida.', next ? 'error' : 'success');
                return next;
            });
        }} parallelRecords={parallelRecords} onAddParallelRecord={(plate, company, type, slotCode) => {
            setParallelRecords((prev) => [
                ...prev,
                {
                    id: `CONV-${prev.length + 1}`,
                    plate,
                    company,
                    type,
                    slotCode,
                    amount: type === 'CONVENIO' ? 75000 : 8000,
                    status: 'ACTIVO',
                },
            ]);
            showToast(`Servicio en paralelo (${type}) registrado para ${plate} en plaza ${slotCode} sin alterar caja rotativa.`, 'success');
        }}/>
      </main>

      {/* WIDGET DE TURNO PERSISTENTE */}
      {isShiftActive && (<div id="persistent-shift-widget" className="fixed bottom-5 left-5 z-40 group select-none">
          <div className="h-10 px-4 rounded-full bg-[#0f172a] text-white border border-[rgba(255,255,255,0.08)] shadow-[0_8px_24px_rgba(0,0,0,0.2)] flex items-center gap-2.5 cursor-pointer hover:bg-[#1e293b] transition-all tabular-nums">
            <span className="w-2 h-2 rounded-full bg-emerald-400 live-pulse"/>
            <span className="text-[13px] font-mono font-bold" id="widget-shift-timer">
              {shiftTimerStr}
            </span>
            <span className="text-[rgba(255,255,255,0.2)]">|</span>
            <span className="text-[13px] font-semibold">Juan P.</span>
          </div>
          <div className="hidden group-hover:block absolute bottom-12 left-0 w-72 bg-[#0f172a] border border-[rgba(255,255,255,0.08)] rounded-2xl p-5 shadow-[0_16px_48px_rgba(0,0,0,0.3)] text-white text-xs space-y-4 animate-fade-in-up tabular-nums">
            <div className="flex justify-between border-b border-[rgba(255,255,255,0.06)] pb-3">
              <span className="font-mono text-[10px] text-slate-400 uppercase tracking-[0.08em]">Turno Actual</span>
              <span className="px-2 py-0.5 rounded-full text-[10px] font-mono bg-emerald-950 text-emerald-300 border border-emerald-900">
                GARITA 01
              </span>
            </div>
            <div className="space-y-2.5 font-mono text-[12px]">
              <div className="flex justify-between text-slate-400">
                <span>Fondo Inicial:</span>
                <span className="text-white font-semibold">${initialFloat.toLocaleString('es-CL')}</span>
              </div>
              <div className="flex justify-between text-slate-400">
                <span>Recaudado:</span>
                <span className="text-emerald-400 font-bold">${shiftRevenue.toLocaleString('es-CL')}</span>
              </div>
            </div>
            <div className="pt-3 mt-1 border-t border-[rgba(255,255,255,0.06)]">
              <button onClick={initiateCashClose} className="w-full h-10 rounded-xl bg-rose-950/50 hover:bg-rose-900/70 border border-rose-900/40 text-rose-300 text-xs font-bold flex items-center justify-center gap-2 transition-colors">
                <span>Cerrar Caja y Turno (Corte Z)</span>
              </button>
            </div>
          </div>
        </div>)}

      {/* MODALES OFICIALES */}
      <OfficialModals ticketModalOpen={ticketModalOpen} closeTicketModal={() => setTicketModalOpen(false)} ticketPreviewData={ticketPreviewData} confirmVehicleEntry={confirmVehicleEntry} printPhysicalTicket={() => {
            showToast('Comando enviado a Impresora Térmica (80mm ESC/POS).', 'success');
            setTimeout(() => setTicketModalOpen(false), 500);
        }} sendTicketViaWhatsApp={() => {
            showToast('Comprobante digital enviado vía WhatsApp.', 'success');
            setTimeout(() => setTicketModalOpen(false), 500);
        }} closeShiftModalOpen={closeShiftModalOpen} closeShiftStep={closeShiftStep} closeShiftModal={() => setCloseShiftModalOpen(false)} declareCash={declareCash} setDeclareCash={setDeclareCash} declarePos={declarePos} setDeclarePos={setDeclarePos} declareTransfer={declareTransfer} setDeclareTransfer={setDeclareTransfer} sysCashExpected={192500} sysPosExpected={150000} sysTransExpected={50000} shiftSealHash={shiftSealHash} goToCashCloseStep2={goToCashCloseStep2} backToCashCloseStep1={() => setCloseShiftStep(1)} emitReportZ={() => {
            showToast('Reporte Z emitido en impresora térmica con sello SHA-256.', 'success');
            setCloseShiftStep(3);
        }} confirmShiftClose={() => {
            setCloseShiftModalOpen(false);
            setIsShiftActive(false);
            setChecklistItems([false, false, false, false, false, false]);
            showToast('Sesión cerrada de forma segura.', 'info');
            navigateTo('landing');
        }} manualTxModalOpen={manualTxModalOpen} closeManualTransactionModal={() => setManualTxModalOpen(false)} manualTxType={manualTxType} setManualTxType={setManualTxType} manualTxAmount={manualTxAmount} setManualTxAmount={setManualTxAmount} manualTxDesc={manualTxDesc} setManualTxDesc={setManualTxDesc} manualTxAuth={manualTxAuth} setManualTxAuth={setManualTxAuth} manualTxPin={manualTxPin} setManualTxPin={setManualTxPin} confirmManualTransaction={confirmManualTransaction} pinModalType={pinModalType} closePinModal={() => setPinModalType(null)} pinValue={pinValue} setPinValue={setPinValue} pinReason={pinReason} setPinReason={setPinReason} discountAmountInput={discountAmountInput} setDiscountAmountInput={setDiscountAmountInput} confirmPinException={confirmPinException} shiftAuditResult={shiftAuditResult} isAuditingShift={isAuditingShift}/>

      {/* CONTENEDOR FLOTANTE DE NOTIFICACIONES TOAST */}
      <div id="toast-container" aria-live="polite" className="fixed top-4 right-4 z-50 flex flex-col gap-2.5 pointer-events-none max-w-sm w-full">
        {toasts.map((t) => (<div key={t.id} className={`toast-animate pointer-events-auto flex items-center gap-3 px-4 py-3.5 rounded-xl border shadow-[0_8px_24px_rgba(0,0,0,0.12)] text-[13px] font-medium ${t.type === 'success'
                ? 'bg-[#052e16] text-emerald-100 border-emerald-900/60'
                : t.type === 'error'
                    ? 'bg-[#450a0a] text-rose-100 border-rose-900/60'
                    : 'bg-[#0f172a] text-slate-100 border-slate-800/80'}`}>
            <span className="font-bold text-base shrink-0">
              {t.type === 'success' ? '✓' : t.type === 'error' ? '⚠' : 'ℹ'}
            </span>
            <span className="leading-snug">{t.msg}</span>
          </div>))}
      </div>
    </div>);
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<OfficialParkOpsApp />);
  </script>
</body>
</html>
